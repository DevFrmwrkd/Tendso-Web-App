name: Mobile checks

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "convex/**"
      - "lib/**"
      - "types/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".easignore"
      - ".github/workflows/check-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "convex/**"
      - "lib/**"
      - "types/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".easignore"
      - ".github/workflows/check-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run mobile:typecheck
      - run: npm run mobile:test -- --runInBand
      - run: npm run mobile:bundle
